<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
SFX Register
</title>

<link rel="stylesheet"
href="style.css">

</head>

<body>

<div class="auth-container">

<div class="auth-card">

<img
src="logo.png"
class="auth-logo">

<h1>
Create Account
</h1>

<p>
Join SFX Heatmap
</p>

<input
type="email"
id="registerEmail"
placeholder="Email">

<input
type="password"
id="registerPassword"
placeholder="Password">

<button id="registerBtn">

REGISTER

</button>

<a href="login.html">

Already have account

</a>

</div>

</div>

<script type="module"
src="auth.js"></script>

</body>
</html>
