<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
SFX Login
</title>

<link rel="stylesheet"
href="style.css">

</head>

<body>

<div class="auth-container">

<img

SFX HEATMAP

</button>

<a href="register.html">

</a>

</div>

</div>

<script type="module"
src="auth.js"></script>

</html>
